<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Demo - Learning Only</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0a0a1a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .game {
    background: #1a1a2e;
    border-radius: 20px;
    padding: 25px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 0 40px rgba(0,255,150,0.2);
  }
  h1 {
    text-align: center;
    color: #00ff96;
    margin-bottom: 15px;
    font-size: 22px;
  }
  .warning {
    background: #ff4444;
    color: white;
    padding: 8px;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    margin-bottom: 15px;
  }
  .screen {
    background: linear-gradient(180deg, #0a0a1a, #1a1a3e);
    height: 220px;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    margin-bottom: 15px;
    border: 2px solid #00ff96;
  }
  .plane {
    font-size: 40px;
    position: absolute;
    bottom: 20px;
    left: 20px;
    transition: all 0.3s linear;
  }
  .multiplier {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: bold;
    color: #00ff96;
    text-shadow: 0 0 20px #00ff96;
  }
  .crash-text {
    color: #ff4444;
    text-shadow: 0 0 20px #ff4444;
  }
  .balance {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    padding: 10px;
    background: #0a0a1a;
    border-radius: 10px;
  }
  .balance span { color: #00ff96; font-weight: bold; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }
  input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #00ff96;
    background: #0a0a1a;
    color: white;
    font-size: 16px;
  }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-bet {
    background: #00ff96;
    color: #0a0a1a;
    width: 100%;
    padding: 15px;
    font-size: 18px;
  }
  .btn-bet:disabled {
    background: #555;
    cursor: not-allowed;
  }
  .btn-cashout {
    background: #ffaa00;
    color: #0a0a1a;
  }
  .history {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .history span {
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 12px;
    background: #ff4444;
  }
  .history span.win { background: #00ff96; color: #0a0a1a; }
</style>
</head>
<body>
<div class="game">
  <h1>✈️ Aviator Demo</h1>
  <div class="warning">⚠️ SIRF LEARNING - ILLEGAL TO HOST</div>

  <div class="balance">
    <div>Balance: ₹<span id="balance">1000</span></div>
    <div>Last: <span id="lastWin">-</span></div>
  </div>

  <div class="screen">
    <div class="plane" id="plane">✈️</div>
    <div class="multiplier" id="multiplier">1.00x</div>
  </div>

  <div class="controls">
    <input type="number" id="betAmount" value="10" min="1" placeholder="Bet amount">
  </div>

  <button class="btn-bet" id="betBtn" onclick="placeBet()">PLACE BET</button>
  <button class="btn-bet btn-cashout" id="cashoutBtn" onclick="cashOut()" style="display:none; margin-top:10px;">CASH OUT</button>

  <div class="history" id="history"></div>
</div>

<script>
  let balance = 1000;
  let betAmount = 0;
  let multiplier = 1.00;
  let gameRunning = false;
  let hasBet = false;
  let cashedOut = false;
  let interval = null;
  let crashPoint = 0;

  const balanceEl = document.getElementById('balance');
  const multiplierEl = document.getElementById('multiplier');
  const planeEl = document.getElementById('plane');
  const betBtn = document.getElementById('betBtn');
  const cashoutBtn = document.getElementById('cashoutBtn');
  const lastWinEl = document.getElementById('lastWin');
  const historyEl = document.getElementById('history');

  function placeBet() {
    const amt = parseInt(document.getElementById('betAmount').value);
    if (amt < 1 || amt > balance) {
      alert('Invalid bet amount!');
      return;
    }
    betAmount = amt;
    balance -= amt;
    balanceEl.textContent = balance;
    hasBet = true;
    cashedOut = false;
    startGame();
  }

  function startGame() {
    gameRunning = true;
    multiplier = 1.00;
    planeEl.style.bottom = '20px';
    planeEl.style.left = '20px';
    planeEl.textContent = '✈️';
    multiplierEl.classList.remove('crash-text');

    // Random crash point (house edge)
    crashPoint = (Math.random() * 10 + 1).toFixed(2);

    betBtn.disabled = true;
    betBtn.textContent = 'FLYING...';
    cashoutBtn.style.display = 'block';

    interval = setInterval(() => {
      multiplier += 0.01 + (multiplier * 0.005);
      
      if (multiplier >= crashPoint) {
        crash();
        return;
      }

      multiplierEl.textContent = multiplier.toFixed(2) + 'x';
      
      // Move plane
      const progress = Math.min(multiplier / 10, 1);
      planeEl.style.bottom = (20 + progress * 140) + 'px';
      planeEl.style.left = (20 + progress * 280) + 'px';
    }, 100);
  }

  function cashOut() {
    if (!gameRunning || !hasBet || cashedOut) return;
    cashedOut = true;
    const winAmount = Math.floor(betAmount * multiplier);
    balance += winAmount;
    balanceEl.textContent = balance;
    lastWinEl.textContent = '₹' + winAmount;
    
    clearInterval(interval);
    gameRunning = false;
    hasBet = false;
    
    planeEl.textContent = '💰';
    multiplierEl.textContent = multiplier.toFixed(2) + 'x (CASHED)';
    
    addHistory(multiplier.toFixed(2) + 'x', true);
    resetButtons();
  }

  function crash() {
    clearInterval(interval);
    gameRunning = false;
    
    planeEl.textContent = '💥';
    multiplierEl.textContent = crashPoint + 'x CRASHED';
    multiplierEl.classList.add('crash-text');
    lastWinEl.textContent = 'LOST ₹' + betAmount;
    
    addHistory(crashPoint + 'x', false);
    
    hasBet = false;
    resetButtons();
    
    setTimeout(() => {
      multiplierEl.textContent = '1.00x';
      planeEl.textContent = '✈️';
      planeEl.style.bottom = '20px';
      planeEl.style.left = '20px';
    }, 2000);
  }

  function resetButtons() {
    betBtn.disabled = false;
    betBtn.textContent = 'PLACE BET';
    cashoutBtn.style.display = 'none';
  }

  function addHistory(text, win) {
    const span = document.createElement('span');
    span.textContent = text;
    if (win) span.classList.add('win');
    historyEl.prepend(span);
    if (historyEl.children.length > 10) {
      historyEl.removeChild(historyEl.lastChild);
    }
  }
</script>
</body>
</html>
