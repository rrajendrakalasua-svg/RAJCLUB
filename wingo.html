<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDG Win - Win Go</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #1a0033, #330066);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    padding: 15px;
  }
  .container {
    background: rgba(0,0,0,0.7);
    border: 2px solid #ffcc00;
    border-radius: 15px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 0 25px #ffcc00;
  }
  h1 {
    text-align: center;
    color: #ffcc00;
    margin-bottom: 10px;
    font-size: 22px;
  }
  .balance {
    text-align: center;
    font-size: 16px;
    margin-bottom: 12px;
    background: #222;
    padding: 8px;
    border-radius: 8px;
  }
  .balance span { color: #00ff88; font-weight: bold; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
    background: #111;
    padding: 5px;
    border-radius: 10px;
  }
  .tab {
    flex: 1;
    padding: 10px 5px;
    text-align: center;
    background: transparent;
    color: #aaa;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .tab.active {
    background: linear-gradient(135deg, #ffcc00, #ff8800);
    color: #000;
  }

  .round-info {
    text-align: center;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 5px;
  }
  .round-info span { color: #ffcc00; font-weight: bold; }

  .timer {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    color: #ff4444;
    margin: 5px 0;
    text-shadow: 0 0 15px #ff4444;
    font-family: 'Courier New', monospace;
  }
  .timer.safe { color: #00ff88; text-shadow: 0 0 15px #00ff88; }

  .result {
    text-align: center;
    font-size: 15px;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    background: #111;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .colors {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 12px 0;
  }
  .color-btn {
    padding: 18px 5px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    transition: transform 0.15s;
    line-height: 1.3;
  }
  .color-btn:active { transform: scale(0.94); }
  .color-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .green { background: linear-gradient(135deg, #00cc55, #009933); }
  .red { background: linear-gradient(135deg, #ff2222, #aa0000); }
  .violet { background: linear-gradient(135deg, #bb33ff, #7700cc); }

  .number-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    margin-top: 10px;
  }
  .num-btn {
    padding: 10px 0;
    background: #222;
    color: #ffcc00;
    border: 1px solid #444;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  }
  .num-btn:active { background: #444; }

  .bet-section {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ffcc00;
    background: #111;
    color: #fff;
    font-size: 15px;
  }

  .quick-bets {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
  }
  .quick-bets button {
    flex: 1;
    padding: 6px;
    background: #222;
    color: #ffcc00;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }

  .history-title {
    font-size: 13px;
    color: #aaa;
    margin-top: 12px;
    margin-bottom: 5px;
  }
  .history {
    display: flex;
    gap: 5px;
    justify-content: flex-start;
    flex-wrap: wrap;
  }
  .dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
  }
  .dot.g { background: #00ff88; color: #000; }
  .dot.r { background: #ff3333; }
  .dot.v { background: #bb33ff; }
  .dot.gv { background: linear-gradient(90deg, #00ff88 50%, #bb33ff 50%); color: #000; }
  .dot.rv { background: linear-gradient(90deg, #ff3333 50%, #bb33ff 50%); }
</style>
</head>
<body>
<div class="container">
  <h1>🎯 BDG WIN - Win Go</h1>
  <div class="balance">Balance: ₹<span id="balance">1000</span></div>

  <!-- Mode Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchMode('30s', this)">Win Go 30s</button>
    <button class="tab" onclick="switchMode('1m', this)">Win Go 1 Min</button>
  </div>

  <div class="round-info">Period: <span id="period">20261005100001</span></div>
  <div class="timer" id="timer">30</div>
  <div class="result" id="result">Apna color choose karein!</div>

  <div class="bet-section">
    <input type="number" id="betAmount" placeholder="Bet Amount" value="10" min="10">
  </div>

  <div class="quick-bets">
    <button onclick="setBet(10)">₹10</button>
    <button onclick="setBet(50)">₹50</button>
    <button onclick="setBet(100)">₹100</button>
    <button onclick="setBet(500)">₹500</button>
    <button onclick="setBet(1000)">₹1000</button>
  </div>

  <div class="colors">
    <button class="color-btn green" onclick="placeBet('green', 2)">GREEN<br>x2</button>
    <button class="color-btn violet" onclick="placeBet('violet', 4.5)">VIOLET<br>x4.5</button>
    <button class="color-btn red" onclick="placeBet('red', 2)">RED<br>x2</button>
  </div>

  <div class="number-grid" id="numberGrid"></div>

  <div class="history-title">📊 Last 10 Results:</div>
  <div class="history" id="history"></div>
</div>

<script>
  let balance = 1000;
  let timeLeft = 30;
  let mode = '30s'; // '30s' or '1m'
  let currentBet = null;
  let history = [];
  let timerInterval = null;
  let periodCounter = 100001;

  const timerEl = document.getElementById('timer');
  const resultEl = document.getElementById('result');
  const balanceEl = document.getElementById('balance');
  const historyEl = document.getElementById('history');
  const periodEl = document.getElementById('period');

  // Number grid 0-9
  const numberGrid = document.getElementById('numberGrid');
  for (let i = 0; i <= 9; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.textContent = i;
    btn.onclick = () => placeNumberBet(i);
    numberGrid.appendChild(btn);
  }

  function updateBalance() {
    balanceEl.textContent = balance.toFixed(2);
  }

  function setBet(amt) {
    document.getElementById('betAmount').value = amt;
  }

  function switchMode(newMode, btn) {
    if (currentBet) {
      resultEl.textContent = "⚠️ Round chal raha hai, wait karein!";
      return;
    }
    mode = newMode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    resetTimer();
  }

  function getRoundTime() {
    return mode === '30s' ? 30 : 60;
  }

  function resetTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = getRoundTime();
    timerEl.textContent = timeLeft;
    timerEl.classList.remove('safe');
    newPeriod();
    startTimer();
  }

  function newPeriod() {
    periodCounter++;
    const date = new Date();
    const ymd = date.getFullYear() + String(date.getMonth()+1).padStart(2,'0') + String(date.getDate()).padStart(2,'0');
    periodEl.textContent = ymd + '1' + periodCounter;
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;

      // Last 5 seconds = red (betting closed feel)
      if (timeLeft <= 5) {
        timerEl.classList.remove('safe');
      } else {
        timerEl.classList.add('safe');
      }

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        declareResult();
      }
    }, 1000);
  }

  function placeBet(color, multiplier) {
    if (timeLeft <= 5) {
      resultEl.textContent = "⏰ Betting band ho gayi! Next round wait karein.";
      return;
    }
    const amt = parseFloat(document.getElementById('betAmount').value);
    if (!amt || amt < 10) {
      resultEl.textContent = "⚠️ Minimum bet ₹10 hai!";
      return;
    }
    if (amt > balance) {
      resultEl.textContent = "❌ Balance kam hai!";
      return;
    }
    if (currentBet) {
      resultEl.textContent = "⏳ Aapne already bet laga di hai!";
      return;
    }
    balance -= amt;
    updateBalance();
    currentBet = { color, multiplier, amount: amt, type: 'color' };
    resultEl.textContent = `✅ ${color.toUpperCase()} pe ₹${amt} lagaya (x${multiplier})`;
  }

  function placeNumberBet(num) {
    if (timeLeft <= 5) {
      resultEl.textContent = "⏰ Betting band ho gayi!";
      return;
    }
    const amt = parseFloat(document.getElementById('betAmount').value);
    if (!amt || amt < 10) {
      resultEl.textContent = "⚠️ Minimum bet ₹10 hai!";
      return;
    }
    if (amt > balance) {
      resultEl.textContent = "❌ Balance kam hai!";
      return;
    }
    if (currentBet) {
      resultEl.textContent = "⏳ Aapne already bet laga di hai!";
      return;
    }
    balance -= amt;
    updateBalance();
    currentBet = { color: 'num' + num, multiplier: 9, amount: amt, type: 'number', number: num };
    resultEl.textContent = `✅ Number ${num} pe ₹${amt} lagaya (x9)`;
  }

  function declareResult() {
    // Generate result number 0-9
    const resultNum = Math.floor(Math.random() * 10);

    // Determine color
    let resultColor;
    if ([1,3,7,9].includes(resultNum)) resultColor = 'green';
    else if ([2,4,6,8].includes(resultNum)) resultColor = 'red';
    else if (resultNum === 0) resultColor = 'violet-red';
    else if (resultNum === 5) resultColor = 'violet-green';

    // History dot
    let cls = '';
    if (resultColor === 'green') cls = 'g';
    else if (resultColor === 'red') cls = 'r';
    else if (resultColor === 'violet-red') cls = 'rv';
    else if (resultColor === 'violet-green') cls = 'gv';

    history.unshift({ num: resultNum, cls });
    if (history.length > 10) history.pop();
    renderHistory();

    // Check win
    if (currentBet) {
      let won = false;
      let winAmount = 0;

      if (currentBet.type === 'color') {
        // Green: 1,3,7,9 | Red: 2,4,6,8 | Violet: 0,5
        if (currentBet.color === 'green' && [1,3,7,9].includes(resultNum)) {
          won = true; winAmount = currentBet.amount * 2;
        } else if (currentBet.color === 'red' && [2,4,6,8].includes(resultNum)) {
          won = true; winAmount = currentBet.amount * 2;
        } else if (currentBet.color === 'violet' && [0,5].includes(resultNum)) {
          won = true; winAmount = currentBet.amount * 4.5;
        }
      } else if (currentBet.type === 'number') {
        if (currentBet.number === resultNum) {
          won = true; winAmount = currentBet.amount * 9;
        }
      }

      if (won) {
        balance += winAmount;
        updateBalance();
        resultEl.textContent = `🎉 WIN! Result: ${resultNum} | Jeeta ₹${winAmount.toFixed(2)}`;
      } else {
        resultEl.textContent = `😢 LOSS! Result: ${resultNum} | Haara ₹${currentBet.amount}`;
      }
      currentBet = null;
    } else {
      resultEl.textContent = `Result: ${resultNum} (aapne bet nahi lagayi)`;
    }

    // Next round after 3 sec
    setTimeout(resetTimer, 3000);
  }

  function renderHistory() {
    historyEl.innerHTML = history.map(h =>
      `<div class="dot ${h.cls}">${h.num}</div>`
    ).join('');
  }

  // Init
  updateBalance();
  resetTimer();
</script>
</body>
</html>
